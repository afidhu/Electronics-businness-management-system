<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary metadata -->
    <title>ElectroCore EBMS | Electronics Business Management System</title>
    <meta
      name="description"
      content="ElectroCore EBMS is an electronics business management system designed to help electronics retailers manage inventory, IMEI and serial numbers, procurement, sales, payments, and business operations from one platform."
    />
    <meta name="application-name" content="ElectroCore EBMS" />
    <meta name="robots" content="index, follow" />

    <!-- Icons and browser colours -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b2160" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, Telegram, …).
         og:url, og:image and the canonical link are made absolute at build
         time from VITE_SITE_URL (see vite.config.ts → siteMetadata). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ElectroCore EBMS" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="ElectroCore EBMS | Electronics Business Management System" />
    <meta
      property="og:description"
      content="ElectroCore EBMS is an electronics business management system designed to help electronics retailers manage inventory, IMEI and serial numbers, procurement, sales, payments, and business operations from one platform."
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ElectroCore EBMS — Electronics Business Management System: Inventory, Procurement, POS, Sales, Reports"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ElectroCore EBMS | Electronics Business Management System" />
    <meta
      name="twitter:description"
      content="ElectroCore EBMS is an electronics business management system designed to help electronics retailers manage inventory, IMEI and serial numbers, procurement, sales, payments, and business operations from one platform."
    />
    <meta
      name="twitter:image:alt"
      content="ElectroCore EBMS — Electronics Business Management System: Inventory, Procurement, POS, Sales, Reports"
    />
  </head>
  <body>
    <noscript>ElectroCore EBMS — Electronics Business Management System. Please enable JavaScript to use the application.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
