<!doctype html>
<!--
  Source of public/og-thumbnail.png (1200 × 630, Open Graph / Twitter card).
  Self-contained: no external fonts, images or logos. ElectroCore EBMS is an
  independent product; the device drawings are generic outlines, not any
  manufacturer's product. Regenerate with: npm run og:thumbnail
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: 'Noto Sans', 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif;
        background: radial-gradient(circle at 78% 30%, #1e4fd6 0%, #123a9c 28%, #0b2160 58%, #07142f 100%);
        color: #fff;
        position: relative;
      }
      svg.bg { position: absolute; inset: 0; }
      .content { position: absolute; left: 72px; top: 88px; width: 720px; }
      .mark {
        display: inline-flex; align-items: center; justify-content: center;
        width: 76px; height: 76px; border-radius: 18px;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.18);
        font-weight: 800; font-size: 31px; letter-spacing: 1px;
      }
      .kicker {
        display: inline-block; margin-left: 18px; vertical-align: middle;
        font-size: 20px; font-weight: 600; letter-spacing: 3px; color: #9ec2ff; text-transform: uppercase;
      }
      h1 { margin-top: 34px; font-size: 74px; line-height: 1.05; font-weight: 800; letter-spacing: -1px; white-space: nowrap; }
      h1 span { color: #7fb0ff; }
      .subtitle { margin-top: 14px; font-size: 31px; font-weight: 500; color: #dce8ff; line-height: 1.2; white-space: nowrap; }
      .labels { margin-top: 44px; display: flex; flex-wrap: nowrap; gap: 10px; }
      .labels span {
        font-size: 21px; font-weight: 700; padding: 9px 16px; border-radius: 999px; white-space: nowrap;
        background: rgba(255, 255, 255, 0.1); border: 1.5px solid rgba(158, 194, 255, 0.55); color: #fff;
      }
      .footer {
        position: absolute; left: 72px; bottom: 40px; font-size: 20px; color: #9ec2ff; letter-spacing: 0.5px;
      }
      .footer b { color: #fff; font-weight: 700; }
    </style>
  </head>
  <body>
    <svg class="bg" width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2b63e8" stop-opacity="0.55" />
          <stop offset="1" stop-color="#0b2160" stop-opacity="0.2" />
        </linearGradient>
        <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#07142f" stop-opacity="0.85" />
          <stop offset="0.55" stop-color="#07142f" stop-opacity="0" />
        </linearGradient>
      </defs>

      <!-- subtle circuit traces -->
      <g fill="none" stroke="#7fb0ff" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M640 40 H820 L860 80 H1160" />
        <path d="M700 110 H780 L810 140 H1000 L1030 110 H1200" />
        <path d="M600 590 H760 L800 550 H980 L1010 580 H1200" />
        <path d="M680 520 H740 L770 490 H880" />
        <path d="M1150 140 V230 L1120 260 V420" />
        <path d="M0 600 H120 L150 570 H330" />
        <path d="M0 30 H90 L120 60 H260" />
      </g>
      <g fill="#7fb0ff" fill-opacity="0.35">
        <circle cx="1160" cy="80" r="5" /><circle cx="1200" cy="110" r="5" /><circle cx="880" cy="490" r="5" />
        <circle cx="1120" cy="420" r="5" /><circle cx="330" cy="570" r="5" /><circle cx="260" cy="60" r="5" />
      </g>

      <!-- generic laptop outline -->
      <g transform="translate(838 176) scale(0.86)" fill="none" stroke="#bcd5ff" stroke-width="4" stroke-linejoin="round">
        <rect x="0" y="0" width="300" height="190" rx="14" fill="url(#screen)" />
        <rect x="18" y="18" width="264" height="154" rx="6" stroke-opacity="0.5" stroke-width="2" />
        <!-- dashboard bars on the screen -->
        <g stroke="none" fill="#bcd5ff">
          <rect x="40" y="120" width="26" height="36" rx="3" fill-opacity="0.55" />
          <rect x="78" y="96" width="26" height="60" rx="3" fill-opacity="0.7" />
          <rect x="116" y="108" width="26" height="48" rx="3" fill-opacity="0.55" />
          <rect x="154" y="74" width="26" height="82" rx="3" fill-opacity="0.85" />
          <rect x="40" y="40" width="120" height="12" rx="6" fill-opacity="0.6" />
          <rect x="40" y="60" width="80" height="10" rx="5" fill-opacity="0.35" />
          <rect x="200" y="40" width="64" height="116" rx="8" fill-opacity="0.18" />
        </g>
        <path d="M-30 190 H330 L312 214 H-12 Z" fill="#163a8f" />
      </g>

      <!-- generic smartphone outline with IMEI-style barcode -->
      <g transform="translate(1062 300) scale(0.9)" fill="none" stroke="#e3edff" stroke-width="4" stroke-linejoin="round">
        <rect x="0" y="0" width="112" height="208" rx="18" fill="#0f2e7a" />
        <rect x="10" y="22" width="92" height="160" rx="6" fill="url(#screen)" stroke-opacity="0.45" stroke-width="2" />
        <line x1="44" y1="11" x2="68" y2="11" stroke-width="3" stroke-linecap="round" />
        <g stroke="#e3edff" stroke-width="3" stroke-opacity="0.9">
          <line x1="24" y1="120" x2="24" y2="158" /><line x1="31" y1="120" x2="31" y2="158" stroke-width="2" />
          <line x1="37" y1="120" x2="37" y2="158" stroke-width="5" /><line x1="46" y1="120" x2="46" y2="158" stroke-width="2" />
          <line x1="52" y1="120" x2="52" y2="158" /><line x1="60" y1="120" x2="60" y2="158" stroke-width="5" />
          <line x1="68" y1="120" x2="68" y2="158" stroke-width="2" /><line x1="74" y1="120" x2="74" y2="158" />
          <line x1="82" y1="120" x2="82" y2="158" stroke-width="5" /><line x1="89" y1="120" x2="89" y2="158" stroke-width="2" />
        </g>
        <rect x="24" y="44" width="64" height="10" rx="5" fill="#e3edff" fill-opacity="0.6" stroke="none" />
        <rect x="24" y="62" width="44" height="8" rx="4" fill="#e3edff" fill-opacity="0.35" stroke="none" />
      </g>

      <!-- microchip -->
      <g transform="translate(870 470) scale(0.8)" fill="none" stroke="#7fb0ff" stroke-width="3" stroke-opacity="0.55">
        <rect x="0" y="0" width="64" height="64" rx="8" />
        <rect x="16" y="16" width="32" height="32" rx="4" stroke-opacity="0.8" />
        <path d="M12 0 V-12 M26 0 V-12 M40 0 V-12 M54 0 V-12 M12 64 V76 M26 64 V76 M40 64 V76 M54 64 V76 M0 14 H-12 M0 32 H-12 M0 50 H-12 M64 14 H76 M64 32 H76 M64 50 H76" stroke-linecap="round" />
      </g>

      <!-- keep the text side calm -->
      <rect x="0" y="0" width="1200" height="630" fill="url(#fadeLeft)" />
    </svg>

    <div class="content">
      <div><span class="mark">EC</span><span class="kicker">Business software</span></div>
      <h1>ElectroCore <span>EBMS</span></h1>
      <p class="subtitle">Electronics Business Management System</p>
      <div class="labels">
        <span>Inventory</span><span>Procurement</span><span>POS</span><span>Sales</span><span>Reports</span>
      </div>
    </div>
    <div class="footer"><b>IMEI &amp; serial tracking</b> · stock · purchasing · payments — for electronics retailers</div>
  </body>
</html>
